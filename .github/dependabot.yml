version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: "/mobile/staff"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-staff:
        patterns:
          - "expo*"
          - "@expo*"
          - "react-native*"
          - "@sentry/*"

  - package-ecosystem: npm
    directory: "/mobile/customer"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-customer:
        patterns:
          - "expo*"
          - "@expo*"
          - "react-native*"
          - "@sentry/*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
