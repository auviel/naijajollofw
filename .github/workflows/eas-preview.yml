name: EAS preview

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which Expo app to build
        type: choice
        options:
          - customer
          - staff
          - both
        default: customer
      profile:
        description: EAS build profile
        type: choice
        options:
          - development
          - preview
        default: preview
      platform:
        description: Target platform
        type: choice
        options:
          - ios
          - android
          - all
        default: all

jobs:
  build:
    name: eas ${{ matrix.app }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'both' && fromJson('["customer","staff"]') || fromJson(format('["{0}"]', inputs.app)) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: mobile/${{ matrix.app }}
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build ${{ matrix.app }}
        working-directory: mobile/${{ matrix.app }}
        env:
          EAS_PLATFORM: ${{ inputs.platform }}
          EAS_PROFILE: ${{ inputs.profile }}
        run: eas build --non-interactive --platform "$EAS_PLATFORM" --profile "$EAS_PROFILE" --no-wait
